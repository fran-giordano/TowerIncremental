name: 🐛 Bug
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasa?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué debería pasar?
