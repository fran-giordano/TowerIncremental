name: 🐛 Bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasa?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Elegir Difícil\n2. Construir torre Explosiva\n3. ..."
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué debería pasar?
  - type: input
    id: version
    attributes:
      label: Versión / commit
      description: Release o commit donde lo viste.
